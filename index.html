<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkinDrop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a0a0a;--card:#161616;--line:#262626;--acc:#ff9800;--acc2:#ffc107;--txt:#fff;--mut:#9a9a9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;padding-bottom:80px}
[hidden]{display:none!important}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
h1{color:var(--acc);font-size:44px;margin:0 0 8px}
#view{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;color:var(--acc2)}
.muted{color:var(--mut);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#000;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer;margin:10px 0}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
textarea{width:100%;background:#000;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:80px;font-size:15px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#101010;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
#nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0;font-size:10px;cursor:pointer}
#nav button span{display:block;font-size:20px}
#nav button.on{color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.img{height:90px;display:flex;align-items:center;justify-content:center;font-size:40px}.img img{max-width:100%;max-height:90px}.buy{margin:8px 0 0;padding:10px;font-size:14px}
input{width:100%;background:#000;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0;font-size:15px}
.give{background:var(--acc);border:0;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer}
.av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#000;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<div id="login" hidden>
<h1>SkinDrop</h1>
<p class="muted">Выполняй задания, копи монеты и выигрывай скины CS</p>
<button class="btn" id="gbtn" style="max-width:320px">Войти через Google</button>
</div>
<div id="app" hidden><div id="view"></div><div id="nav"></div></div>
<script>
const U='https://avktxobeuotcqmyyowfc.supabase.co',K='sb_publishable_kCus-p2EfSvqU9POFNL94Q_qpu957aq';
const sb=supabase.createClient(U,K);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,tab='home',uid=null;
const tabs=[['home','🏠','Главная'],['shop','🔫','Магазин'],['tasks','📋','Задания'],['wheel','🎡','Колесо'],['inv','🎒','Инвентарь'],['me','👤','Профиль']];
const isAdmin=()=>me&&(me.role==='senior'||me.role==='junior');

$('gbtn').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});

async function loadMe(){
  const r=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();
  me=r.data;return me;
}
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('login').hidden=false;$('app').hidden=true;return}
  uid=session.user.id;
  if(!(await loadMe())){await new Promise(r=>setTimeout(r,900));await loadMe()}
  if(!me){alert('Не удалось загрузить профиль. Обнови страницу.');return}
  $('login').hidden=true;$('app').hidden=false;show(tab);
}
function show(t){
  tab=t;
  const list=tabs.slice();if(isAdmin())list.push(['admin','⚙️','Админ']);
  $('nav').innerHTML=list.map(x=>`<button class="${x[0]===t?'on':''}" data-t="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.t));
  ({home,me:profile,admin,shop,inv,tasks,wheel}[t]||soon)(t);
  window.scrollTo(0,0);
}
function soon(t){
  const n=tabs.find(x=>x[0]===t);
  $('view').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">${n[1]}</div><h2>${n[2]}</h2><p class="muted">Скоро откроется</p></div>`;
}
async function home(){
  $('view').innerHTML=`<div class="card"><div class="muted">Баланс</div><div class="big">🪙 ${me.coins}</div></div>
  <button class="btn" id="claim">🎁 Ежедневная награда (серия: ${me.streak} дн.)</button>
  <div id="msg" class="muted"></div>
  <div class="card"><h3 style="margin-top:0">Промокод или код друга</h3><input id="pc" placeholder="Введите код"><button class="btn" id="pb">Активировать</button><div id="pm" class="muted"></div></div>
  <div class="card"><h3 style="margin-top:0">Пригласить друга</h3><div class="muted">Твой код:</div><div class="big">${esc(me.ref_code||'')}</div><div class="muted">Отправь другу ссылку и код. Когда друг введёт код и заберёт первую награду, вы оба получите монеты.</div><button class="btn ghost" id="cp">Скопировать приглашение</button></div>
  <h3>Уведомления</h3><div id="notes" class="card muted">Загрузка…</div>`;
  $('claim').onclick=async()=>{
    const {data,error}=await sb.rpc('claim_daily');
    if(error){$('msg').textContent='Ошибка: '+error.message;return}
    if(!data.ok){$('msg').textContent=data.msg;return}
    await loadMe();home();
    setTimeout(()=>{const m=$('msg');if(m)m.textContent='Получено монет: '+data.reward+' (день '+data.streak+')'+(data.bonus?'. Бонус за друга: '+data.bonus:'')},50);
  };
  $('pb').onclick=async()=>{
    const c=$('pc').value.trim();if(!c)return;
    const {data,error}=await sb.rpc('redeem_code',{p_code:c});
    if(error||!data.ok){$('pm').textContent=error?error.message:data.msg;return}
    await loadMe();home();
    $('msg').textContent=data.ref?'Код друга принят! Бонус придёт после первой ежедневной награды':'Получено монет: '+data.reward;
  };
  $('cp').onclick=()=>{
    const t='Заходи в SkinDrop: '+location.origin+location.pathname+' Мой код: '+me.ref_code;
    if(navigator.clipboard)navigator.clipboard.writeText(t);
    $('cp').textContent='Скопировано';
  };
  const r=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(10);
  const n=$('notes');if(!n)return;
  n.innerHTML=(r.data&&r.data.length)?r.data.map(x=>`<div class="row"><span>${esc(x.text)}</span><span class="muted">${new Date(x.created_at).toLocaleDateString('ru-RU')}</span></div>`).join(''):'Пока нет уведомлений';
}
function profile(){
  const name=me.name||(me.email||'?').split('@')[0];
  $('view').innerHTML=`<div class="card" style="text-align:center"><div class="av">${esc(name.charAt(0).toUpperCase())}</div><h2 style="margin:0">${esc(name)}</h2><div class="muted">${esc(me.email)}</div></div>
  <div class="card"><div class="row"><span>Баланс</span><b>🪙 ${me.coins}</b></div><div class="row"><span>Серия дней</span><b>${me.streak}</b></div><div class="row"><span>Звание</span><b>${esc(me.title||"—")}</b></div></div>
  <button class="btn ghost" id="out">Выйти</button>`;
  $('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
}
async function admin(){
  const v=$('view');
  if(me.role!=='senior'){v.innerHTML=skinCard+wdCard;bindSkin();loadWd();return}
  v.innerHTML=skinCard+wdCard+taskCard+promoCard+wheelCard+`<div class="card"><h3>Отправить уведомление</h3><textarea id="nt" placeholder="Текст для всех игроков"></textarea><button class="btn" id="ns">Отправить</button><div id="nm" class="muted"></div></div>
  <div class="card"><h3>Игроки</h3><div id="pl" class="muted">Загрузка…</div></div>`;
  bindSkin();loadWd();bindTask();bindPromo();loadWheelAdmin();
  $('ns').onclick=async()=>{
    const t=$('nt').value.trim();if(!t)return;
    const {error}=await sb.from('notifications').insert({text:t});
    $('nm').textContent=error?'Ошибка: '+error.message:'Отправлено';
    if(!error)$('nt').value='';
  };
  const r=await sb.from('profiles').select('id,email,name,role,coins').order('created_at',{ascending:false});
  const p=$('pl');if(!p)return;
  p.innerHTML=(r.data||[]).map(x=>`<div class="row"><span>${esc(x.email)}</span><span class="muted">${esc(x.role)} · 🪙${x.coins}</span><button class="give" data-id="${x.id}">+🪙</button></div>`).join('');
  p.querySelectorAll('.give').forEach(b=>b.onclick=async()=>{
    const a=parseInt(prompt('Сколько монет выдать?'),10);
    if(!a||a<=0)return;
    const {error}=await sb.rpc('give_coins',{p_user:b.dataset.id,p_amount:a});
    if(error){alert(error.message);return}
    admin();
  });
}
const skinCard=`<div class="card"><h3>Добавить скин</h3><input id="sn" placeholder="Название (AK-47 | Redline)"><input id="sw" placeholder="Состояние (Field-Tested)"><input id="sp" type="number" placeholder="Цена в монетах"><input id="si" placeholder="Ссылка на фото"><input id="sa" placeholder="На каком Steam-аккаунте лежит"><button class="btn" id="sadd">Добавить</button><div id="sm" class="muted"></div></div>`;
function bindSkin(){
  $('sadd').onclick=async()=>{
    const {error}=await sb.rpc('add_skin',{p_name:$('sn').value.trim(),p_wear:$('sw').value.trim(),p_price:parseInt($('sp').value,10)||0,p_image:$('si').value.trim(),p_steam:$('sa').value.trim()});
    $('sm').textContent=error?'Ошибка: '+error.message:'Скин добавлен';
    if(!error)['sn','sw','sp','si','sa'].forEach(i=>$(i).value='');
  };
}
const pic=x=>x&&x.image?`<img src="${esc(x.image)}" alt="">`:'🔫';
async function shop(){
  $('view').innerHTML='<h3>Магазин</h3><div id="sl" class="muted">Загрузка…</div>';
  const r=await sb.from('skins').select('id,name,wear,price,image').eq('in_stock',true).order('price');
  const l=$('sl');if(!l)return;
  if(!r.data||!r.data.length){l.textContent='Пока нет скинов';return}
  l.className='grid';
  l.innerHTML=r.data.map(x=>`<div class="card"><div class="img">${pic(x)}</div><b>${esc(x.name)}</b><div class="muted">${esc(x.wear)}</div><button class="btn buy" data-id="${x.id}">🪙 ${x.price}</button></div>`).join('');
  l.querySelectorAll('.buy').forEach(b=>b.onclick=async()=>{
    const {data,error}=await sb.rpc('buy_skin',{p_skin:b.dataset.id});
    if(error||!data.ok){alert(error?error.message:data.msg);return}
    await loadMe();shop();alert('Скин куплен! Он в инвентаре');
  });
}
async function inv(){
  $('view').innerHTML='<h3>Инвентарь</h3><div id="il" class="muted">Загрузка…</div>';
  const r=await sb.from('user_skins').select('id,status,skins(name,wear,image,price)').order('created_at',{ascending:false});
  const l=$('il');if(!l)return;
  const rows=r.data||[];
  if(!rows.length){l.textContent='Пока пусто';return}
  const card=(x,b)=>`<div class="card"><div class="img">${pic(x.skins)}</div><b>${esc(x.skins&&x.skins.name)}</b><div class="muted">${esc(x.skins&&x.skins.wear)}</div>${b}</div>`;
  const grp=(st,title,b)=>{const a=rows.filter(x=>x.status===st);return a.length?`<h3>${title}</h3><div class="grid">${a.map(x=>card(x,b?b(x):'')).join('')}</div>`:''};
  l.className='';
  l.innerHTML=grp('owned','Мои скины',x=>`<button class="btn buy" data-a="sell" data-id="${x.id}">Продать за ${x.skins.price}</button><button class="btn ghost buy" data-a="out" data-id="${x.id}">Вывести</button><button class="btn ghost buy" data-a="up" data-id="${x.id}" data-p="${x.skins.price}">Апгрейд</button>`)+grp('pending','Выводятся')+grp('issued','Выведены');
  l.querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.a==='sell'){
      if(!confirm('Продать скин?'))return;
      const {data,error}=await sb.rpc('sell_skin',{p_id:b.dataset.id});
      if(error||!data.ok){alert(error?error.message:data.msg);return}
      await loadMe();inv();
    }else if(b.dataset.a==='up'){upView(b.dataset.id,parseInt(b.dataset.p,10));return}else{
      const link=prompt('Вставьте вашу ссылку обмена Steam (Trade URL)');
      if(!link)return;
      const {data,error}=await sb.rpc('request_withdraw',{p_id:b.dataset.id,p_link:link.trim()});
      if(error||!data.ok){alert(error?error.message:data.msg);return}
      alert('Заявка отправлена');inv();
    }
  });
}
const wdCard='<div class="card"><h3>Заявки на вывод</h3><div id="wd" class="muted">Загрузка…</div></div>';
async function loadWd(){
  const r=await sb.rpc('admin_withdrawals');
  const w=$('wd');if(!w)return;
  const a=r.data||[];
  if(!a.length){w.textContent='Заявок нет';return}
  w.innerHTML=a.map(x=>`<div class="row" style="display:block"><b>${esc(x.skin_name)}</b> <span class="muted">${esc(x.wear)}</span><br><span class="muted">Игрок: ${esc(x.email)}<br>Аккаунт Steam: ${esc(x.steam_account||'не указан')}</span><br><a href="${esc(x.trade_link)}" target="_blank" rel="noopener" style="color:var(--acc)">Открыть ссылку обмена</a><button class="btn ghost" data-id="${x.rid}">Выдано</button></div>`).join('');
  w.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{const {data,error}=await sb.rpc('mark_issued',{p_id:b.dataset.id});if(error||!data.ok){alert(error?error.message:data.msg);return}loadWd()});
}
const taskCard=`<div class="card"><h3>Добавить задание</h3><input id="tt" placeholder="Название (Подпишись на канал)"><input id="tr" type="number" placeholder="Награда в монетах"><input id="tk" placeholder="Ссылка (https://...)"><button class="btn" id="tadd">Добавить</button><div id="tm" class="muted"></div></div>`;
function bindTask(){
  $('tadd').onclick=async()=>{
    const {error}=await sb.rpc('add_task',{p_title:$('tt').value.trim(),p_reward:parseInt($('tr').value,10)||0,p_link:$('tk').value.trim()});
    $('tm').textContent=error?'Ошибка: '+error.message:'Задание добавлено';
    if(!error)['tt','tr','tk'].forEach(i=>$(i).value='');
  };
}
async function tasks(){
  $('view').innerHTML='<h3>Задания</h3><div id="tl" class="muted">Загрузка…</div>';
  const [a,b]=await Promise.all([sb.from('tasks').select('id,title,reward,link').order('created_at'),sb.from('task_progress').select('task_id,done')]);
  const l=$('tl');if(!l)return;
  const pr={};(b.data||[]).forEach(x=>pr[x.task_id]=x);
  const rows=a.data||[];
  if(!rows.length){l.textContent='Пока нет заданий';return}
  l.className='';
  l.innerHTML=rows.map(x=>{
    const p=pr[x.id];
    const btn=!p?`<button class="btn" data-a="go" data-id="${x.id}">Выполнить</button>`:p.done?`<button class="btn ghost" disabled>✅ Выполнено</button>`:`<button class="btn" data-a="ok" data-id="${x.id}">Проверить</button>`;
    return `<div class="card"><b>${esc(x.title)}</b><div class="muted">Награда: 🪙 ${x.reward}</div>${btn}</div>`;
  }).join('');
  l.querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{
    const t=rows.find(x=>x.id===b.dataset.id);
    if(b.dataset.a==='go'){
      if(t&&t.link)window.open(t.link,'_blank','noopener');
      await sb.rpc('start_task',{p_task:b.dataset.id});
      tasks();
    }else{
      const {data,error}=await sb.rpc('complete_task',{p_task:b.dataset.id});
      if(error||!data.ok){alert(error?error.message:data.msg);return}
      await loadMe();alert('Получено монет: '+data.reward);tasks();
    }
  });
}
const promoCard=`<div class="card"><h3>Добавить промокод</h3><input id="mc" placeholder="Код (START100)"><input id="mr" type="number" placeholder="Награда в монетах"><input id="mx" type="number" placeholder="Сколько раз можно использовать (0 = без лимита)"><input id="md" type="number" placeholder="Сколько дней действует (0 = без срока)"><button class="btn" id="madd">Добавить</button><div id="mm" class="muted"></div></div>`;
function bindPromo(){
  $('madd').onclick=async()=>{
    const {error}=await sb.rpc('add_promo',{p_code:$('mc').value.trim(),p_reward:parseInt($('mr').value,10)||0,p_max:parseInt($('mx').value,10)||0,p_days:parseInt($('md').value,10)||0});
    $('mm').textContent=error?'Ошибка: '+error.message:'Промокод добавлен';
    if(!error)['mc','mr','mx','md'].forEach(i=>$(i).value='');
  };
}
async function wheel(){
  $('view').innerHTML='<h3>Колесо фортуны</h3><div id="wh" class="muted">Загрузка…</div>';
  const [a,b]=await Promise.all([sb.from('wheel_prizes').select('id,kind,coins,weight,skins(name,image,in_stock)'),sb.from('app_settings').select('value').eq('key','spin_cost').maybeSingle()]);
  const w=$('wh');if(!w)return;
  const cost=b.data?parseInt(b.data.value,10):100;
  const list=(a.data||[]).filter(x=>x.kind==='coins'||(x.skins&&x.skins.in_stock));
  if(!list.length){w.textContent='Колесо пока пустое';return}
  const total=list.reduce((t,x)=>t+x.weight,0);
  w.className='';
  w.innerHTML=`<button class="btn" id="spin">Крутить за 🪙 ${cost}</button><div id="wr" class="muted"></div><div class="grid">${list.map(x=>`<div class="card" id="p${x.id}" style="text-align:center"><div class="img">${x.kind==='coins'?'💰':pic(x.skins)}</div><b>${x.kind==='coins'?'🪙 '+x.coins:esc(x.skins.name)}</b><div class="muted">${(x.weight/total*100).toFixed(1)}%</div></div>`).join('')}</div>`;
  $('spin').onclick=async()=>{
    $('spin').disabled=true;
    const {data,error}=await sb.rpc('spin_wheel');
    if(error||!data.ok){$('wr').textContent=error?error.message:data.msg;$('spin').disabled=false;return}
    const ids=list.map(x=>x.id),n=ids.length,win=Math.max(0,ids.indexOf(data.prize_id)),end=n*3+win;let k=0;
    const tick=()=>{
      ids.forEach(i=>{const e=$('p'+i);if(e)e.style.outline=''});
      const e=$('p'+ids[k%n]);if(e)e.style.outline='3px solid var(--acc)';
      if(k>=end){loadMe().then(()=>{const r=$('wr');if(r)r.textContent='Выигрыш: '+data.label;const s=$('spin');if(s)s.disabled=false});return}
      k++;setTimeout(tick,40+k*7);
    };
    tick();
  };
}
async function upView(id,price){
  $('view').innerHTML='<h3>Апгрейд</h3><div class="muted">Выбери скин подороже. Если не повезёт, твой скин сгорит.</div><div id="ul" class="muted">Загрузка…</div><button class="btn ghost" id="ub">Назад</button>';
  $('ub').onclick=inv;
  const r=await sb.from('skins').select('id,name,wear,price,image').eq('in_stock',true).gt('price',price).order('price');
  const l=$('ul');if(!l)return;
  if(!r.data||!r.data.length){l.textContent='Нет подходящих скинов в магазине';return}
  l.className='grid';
  l.innerHTML=r.data.map(x=>{const ch=Math.max(5,Math.min(90,Math.floor(price/x.price*95)));return `<div class="card"><div class="img">${pic(x)}</div><b>${esc(x.name)}</b><div class="muted">Шанс: ${ch}%</div><button class="btn buy" data-id="${x.id}">Апгрейд 🪙 ${x.price}</button></div>`}).join('');
  l.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Рискнуть скином?'))return;
    const {data,error}=await sb.rpc('upgrade_skin',{p_my:id,p_target:b.dataset.id});
    if(error||!data.ok){alert(error?error.message:data.msg);return}
    alert(data.win?'Победа! Новый скин в инвентаре':'Не повезло, скин сгорел');inv();
  });
}
const wheelCard='<div class="card"><h3>Колесо фортуны</h3><div id="wa" class="muted">Загрузка…</div></div>';
async function loadWheelAdmin(){
  const [a,b,c]=await Promise.all([sb.from('wheel_prizes').select('id,kind,coins,weight,skins(name)'),sb.from('app_settings').select('value').eq('key','spin_cost').maybeSingle(),sb.from('skins').select('id,name,price').eq('in_stock',true).order('name')]);
  const w=$('wa');if(!w)return;
  const pz=a.data||[],tot=pz.reduce((t,x)=>t+x.weight,0)||1;
  w.className='';
  w.innerHTML=`<div class="muted">Цена вращения (монет)</div><input id="wcst" type="number" value="${esc(b.data?b.data.value:'100')}"><button class="btn ghost" id="wcs">Сохранить цену</button>${pz.map(x=>`<div class="row"><span>${x.kind==='coins'?'🪙 '+x.coins:esc(x.skins&&x.skins.name)}</span><span class="muted">вес ${x.weight} · ${(x.weight/tot*100).toFixed(1)}%</span><button class="give" data-d="${x.id}">✕</button></div>`).join('')}<div class="muted" style="margin-top:10px">Добавить приз</div><select id="wk"><option value="skin">Скин</option><option value="coins">Монеты</option></select><select id="ws">${(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)} (${x.price})</option>`).join('')}</select><input id="wm" type="number" placeholder="Сколько монет (для приза-монет)"><input id="ww" type="number" placeholder="Вес (шанс), например 10"><button class="btn" id="wadd">Добавить приз</button><div id="wmsg" class="muted"></div>`;
  const say=e=>{$('wmsg').textContent=e?'Ошибка: '+e.message:'Готово'};
  $('wcs').onclick=async()=>{const {error}=await sb.rpc('set_spin_cost',{p_cost:parseInt($('wcst').value,10)||0});say(error)};
  $('wadd').onclick=async()=>{
    const sk=$('wk').value==='skin';
    const {error}=await sb.rpc('add_prize',{p_kind:$('wk').value,p_skin:sk?$('ws').value:null,p_coins:sk?0:(parseInt($('wm').value,10)||0),p_weight:parseInt($('ww').value,10)||0});
    if(error)say(error);else loadWheelAdmin();
  };
  w.querySelectorAll('button[data-d]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('del_prize',{p_id:b.dataset.d});if(error)say(error);else loadWheelAdmin()});
}
sb.auth.onAuthStateChange((e)=>{if(e==='SIGNED_IN'&&!me)start()});
start();
</script>
</body>
</html>
